services:
  db:
    image: postgres:16-alpine
    container_name: tasktrack-db
    environment:
      POSTGRES_DB: TaskManagementDB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 2005
    ports:
      - "5432:5432"
    volumes:
      - tasktrack-postgres-data:/var/lib/postgresql/data
      - ../TaskManagementDB/TaskManagementDB.sql:/docker-entrypoint-initdb.d/TaskManagementDB.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d TaskManagementDB"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tasktrack-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=TaskManagementDB;Username=postgres;Password=2005
    ports:
      - "5181:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  tasktrack-postgres-data:
